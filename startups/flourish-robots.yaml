name: Flourish Robots
tagline: A phone-taught home robot for scheduled household tasks
description: >-
  Flourish 1 is a wheeled home robot that owners teach by guiding it through a
  task with a phone. Taught routines can be repeated on demand or assigned a
  schedule. The first batch is limited to 50 units, with deliveries planned
  for December 2026.
problem: Repetitive household chores take time and must be performed again on a regular schedule.
audience:
  - Households seeking help with routine chores
  - Developers building applications for home robots
